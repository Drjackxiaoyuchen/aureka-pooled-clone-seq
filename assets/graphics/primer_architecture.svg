<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620"><rect width="1200" height="620" rx="18" fill="#F7F6FB"/><g font-family="Arial,sans-serif" fill="#33266C"><text x="36" y="48" font-size="27" font-weight="bold">How an indexed ColE1 primer works</text><text x="36" y="115" font-size="21" font-weight="bold">Forward: 5′ → 3′</text><rect x="36" y="133" width="340" height="78" rx="9" fill="#4200AC"/><text x="52" y="163" fill="#FFFFFF" font-size="18">Handle · 17 nt</text><text x="52" y="192" fill="#FFFFFF" font-size="18" font-family="monospace">ACACTCTTTCCCTACAC</text><rect x="392" y="133" width="205" height="78" rx="9" fill="#6FC0A9"/><text x="408" y="163" fill="#33266C" font-size="18">Well index · 6 nt</text><text x="408" y="192" fill="#33266C" font-size="18" font-family="monospace">GAAGTC</text><rect x="613" y="133" width="548" height="78" rx="9" fill="#33266C"/><text x="629" y="163" fill="#FFFFFF" font-size="18">Template-binding arm · 22 nt</text><text x="629" y="192" fill="#FFFFFF" font-size="18" font-family="monospace">CGGTAAGACACGACTTATCGCC</text><text x="36" y="260" font-size="21" font-weight="bold">Reverse: 5′ → 3′</text><rect x="36" y="278" width="340" height="78" rx="9" fill="#4200AC"/><text x="52" y="308" fill="#FFFFFF" font-size="18">Handle · 16 nt</text><text x="52" y="337" fill="#FFFFFF" font-size="18" font-family="monospace">GACTGGAGTTCAGACG</text><rect x="392" y="278" width="205" height="78" rx="9" fill="#6FC0A9"/><text x="408" y="308" fill="#33266C" font-size="18">Well index · 6 nt</text><text x="408" y="337" fill="#33266C" font-size="18" font-family="monospace">ATACGT</text><rect x="613" y="278" width="548" height="78" rx="9" fill="#33266C"/><text x="629" y="308" fill="#FFFFFF" font-size="18">Template-binding arm · 24 nt</text><text x="629" y="337" fill="#FFFFFF" font-size="18" font-family="monospace">GCGTCGATTTTTGTGATGCTCGTC</text><text x="36" y="412" font-size="20">First cycles: only the 3′ binding arm anneals to the original template.</text>
<text x="36" y="447" font-size="20">Later cycles: the 5′ handle and index are copied into the double-stranded PCR product.</text>
<text x="36" y="497" font-size="20" font-weight="bold">Forward read layout</text>
<text x="36" y="533" font-size="18" font-family="monospace">F handle | F index | F arm | retained template | rc(R arm) | rc(R index) | rc(R handle)</text>
<text x="36" y="581" font-size="19">Example A1: forward GAAGTC + reverse ATACGT. Both ends are needed to identify a well.</text></g></svg>