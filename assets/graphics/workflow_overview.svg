<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360"><rect width="1200" height="360" rx="18" fill="#F7F6FB"/><g font-family="Arial,sans-serif" fill="#33266C"><text x="35" y="43" font-size="27" font-weight="bold">From individual colonies to traceable per-well results</text><text x="35" y="77" font-size="17">Pool products after individual PCR and QC. Each well keeps its own forward/reverse index pair.</text><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#6FC0A9"/></marker></defs><rect x="35" y="110" width="175" height="180" rx="12" fill="white" stroke="#E6E1EF"/><circle cx="60" cy="139" r="15" fill="#4200AC"/><text x="60" y="145" text-anchor="middle" fill="white" font-size="17">1</text><text x="47" y="182" font-size="18" font-weight="bold">Check the map</text><text x="47" y="218" font-size="13">Exact circular template</text><text x="47" y="243" font-size="13">One site per arm</text><text x="47" y="268" font-size="13">Keep colony identity</text><path d="M211 200 H222" stroke="#6FC0A9" stroke-width="3" marker-end="url(#arrow)"/><rect x="225" y="110" width="175" height="180" rx="12" fill="white" stroke="#E6E1EF"/><circle cx="250" cy="139" r="15" fill="#4200AC"/><text x="250" y="145" text-anchor="middle" fill="white" font-size="17">2</text><text x="237" y="182" font-size="18" font-weight="bold">Index each well</text><text x="237" y="218" font-size="13">One row F + column R</text><text x="237" y="243" font-size="13">Individual colony PCR</text><text x="237" y="268" font-size="13">Tails label the product</text><path d="M401 200 H412" stroke="#6FC0A9" stroke-width="3" marker-end="url(#arrow)"/><rect x="415" y="110" width="175" height="180" rx="12" fill="white" stroke="#E6E1EF"/><circle cx="440" cy="139" r="15" fill="#4200AC"/><text x="440" y="145" text-anchor="middle" fill="white" font-size="17">3</text><text x="427" y="182" font-size="18" font-weight="bold">Review and pool</text><text x="427" y="218" font-size="13">Expected single band</text><text x="427" y="243" font-size="13">Quantify representation</text><text x="427" y="268" font-size="13">Pool passing products</text><path d="M591 200 H602" stroke="#6FC0A9" stroke-width="3" marker-end="url(#arrow)"/><rect x="605" y="110" width="175" height="180" rx="12" fill="white" stroke="#E6E1EF"/><circle cx="630" cy="139" r="15" fill="#4200AC"/><text x="630" y="145" text-anchor="middle" fill="white" font-size="17">4</text><text x="617" y="174" font-size="18" font-weight="bold">Sequence</text><text x="617" y="196" font-size="18" font-weight="bold">the pool</text><text x="617" y="218" font-size="13">Preserve both ends</text><text x="617" y="243" font-size="13">Obtain raw FASTQ</text><text x="617" y="268" font-size="13">Retain the sample map</text><path d="M781 200 H792" stroke="#6FC0A9" stroke-width="3" marker-end="url(#arrow)"/><rect x="795" y="110" width="175" height="180" rx="12" fill="white" stroke="#E6E1EF"/><circle cx="820" cy="139" r="15" fill="#4200AC"/><text x="820" y="145" text-anchor="middle" fill="white" font-size="17">5</text><text x="807" y="182" font-size="18" font-weight="bold">Separate reads</text><text x="807" y="218" font-size="13">Match the primer set</text><text x="807" y="243" font-size="13">Require both indexes</text><text x="807" y="268" font-size="13">Audit every read</text><path d="M971 200 H982" stroke="#6FC0A9" stroke-width="3" marker-end="url(#arrow)"/><rect x="985" y="110" width="175" height="180" rx="12" fill="white" stroke="#E6E1EF"/><circle cx="1010" cy="139" r="15" fill="#4200AC"/><text x="1010" y="145" text-anchor="middle" fill="white" font-size="17">6</text><text x="997" y="182" font-size="18" font-weight="bold">Inspect results</text><text x="997" y="218" font-size="13">Per-well FASTQ</text><text x="997" y="243" font-size="13">Reference-based maps</text><text x="997" y="268" font-size="13">Confirm an isolate</text><text x="35" y="329" font-size="17">Preferred plan: A1–A4, B1–B4, … H1–H4. Read separation needs no reference; construct screening does.</text></g></svg>