<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650"><rect width="1200" height="650" rx="18" fill="#F7F6FB"/><g font-family="Arial,sans-serif" fill="#33266C"><text x="36" y="48" font-size="27" font-weight="bold">PCR QC before an indexed pool</text><rect x="36" y="94" width="266" height="210" rx="12" fill="white" stroke="#E6E1EF"/><rect x="36" y="94" width="266" height="7" fill="#6FC0A9"/><text x="50" y="134" font-size="20" font-weight="bold">1. Exact template</text><text x="50" y="173" font-size="14">Unique binding sites</text><text x="50" y="208" font-size="14">Opposite extension directions</text><text x="50" y="243" font-size="14">Predict full indexed size</text><rect x="323" y="94" width="266" height="210" rx="12" fill="white" stroke="#E6E1EF"/><rect x="323" y="94" width="266" height="7" fill="#6FC0A9"/><text x="337" y="134" font-size="20" font-weight="bold">2. Product check</text><text x="337" y="173" font-size="14">One band near predicted size</text><text x="337" y="208" font-size="14">No unexpected second band</text><text x="337" y="243" font-size="14">Negative control remains clear</text><rect x="610" y="94" width="266" height="210" rx="12" fill="white" stroke="#E6E1EF"/><rect x="610" y="94" width="266" height="7" fill="#6FC0A9"/><text x="624" y="134" font-size="20" font-weight="bold">3. Quantification</text><text x="624" y="173" font-size="14">Unsaturated image</text><text x="624" y="208" font-size="14">Verify all lane / ladder labels</text><text x="624" y="243" font-size="14">Prefer independent DNA quantification</text><rect x="897" y="94" width="266" height="210" rx="12" fill="white" stroke="#E6E1EF"/><rect x="897" y="94" width="266" height="7" fill="#6FC0A9"/><text x="911" y="134" font-size="20" font-weight="bold">4. Pooling review</text><text x="911" y="173" font-size="14">Equal-length products: normalise mass</text><text x="911" y="208" font-size="14">Different lengths: normalise molarity</text><text x="911" y="243" font-size="14">Retain original colony-to-well link</text><rect x="36" y="338" width="470" height="205" rx="12" fill="#251C44"/><text x="75" y="575" text-anchor="middle" font-size="17">Good</text><rect x="58" y="405" width="34" height="5" fill="#FFFFFF"/><text x="165" y="575" text-anchor="middle" font-size="17">Blank</text><text x="255" y="575" text-anchor="middle" font-size="17">Wrong</text><rect x="238" y="465" width="34" height="5" fill="#FFFFFF"/><text x="345" y="575" text-anchor="middle" font-size="17">Multiple</text><rect x="328" y="405" width="34" height="5" fill="#FFFFFF"/><rect x="328" y="465" width="34" height="5" fill="#FFFFFF"/><text x="435" y="575" text-anchor="middle" font-size="17">Clipped</text><rect x="418" y="405" width="34" height="13" fill="#FFFFFF"/><text x="545" y="373" font-size="21" font-weight="bold">Before pooling</text>
<text x="545" y="412" font-size="18">Exclude blank sample lanes, wrong-size and multiple products.</text>
<text x="545" y="447" font-size="18">Re-image clipped lanes before estimating relative abundance.</text>
<text x="545" y="482" font-size="18">Image QC alone cannot prove sequence identity or concentration.</text>
<text x="36" y="615" font-size="17">Gel cartoons are illustrative. Product size comes from the exact map, including the two indexed tails.</text></g></svg>