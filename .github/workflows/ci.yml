name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install '.[dev]' build
      - run: python -m pytest -q
      - name: Verify all synthetic outcomes
        run: python demo/run_demo.py --out /tmp/apcs-demo
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-report-python-${{ matrix.python-version }}
          path: /tmp/apcs-demo/sequencing/result/report
